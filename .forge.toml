# ==============================================================================
# oh-my-forge baseline .forge.toml
# ==============================================================================
# This is the baseline configuration shipped by oh-my-forge. Copy it to
# ~/forge/.forge.toml for a global install, or keep a project-local override
# at <repo-root>/.forge.toml alongside any project-specific AGENTS.md.
#
# forgecode loads GLOBAL config only: the real search path is ~/forge/.forge.toml.
# (There is no project-local .forge.toml ingress in the loader — see
# crates/forge_config/src/reader.rs:48-61. Project-scoped tuning lives in
# per-agent frontmatter, AGENTS.md, and per-skill/command files instead.)
#
# Schema reference: https://forgecode.dev/schema.json
# Full documentation: docs/CONFIGURATION.md
# Provider list:      see docs/CONFIGURATION.md (30+ providers supported)
# ==============================================================================
"$schema" = "https://forgecode.dev/schema.json"

# ------------------------------------------------------------------------------
# Top-level knobs (flat keys, NOT nested under [tools.*])
# ------------------------------------------------------------------------------
max_search_lines          = 1000
max_search_result_bytes   = 10240
max_fetch_chars           = 50000
max_stdout_prefix_lines   = 100
max_stdout_suffix_lines   = 100
max_stdout_line_chars     = 500
max_line_chars            = 2000
max_read_lines            = 2000
max_file_read_batch_size  = 50
max_file_size_bytes       = 104857600
max_image_size_bytes      = 262144
tool_timeout_secs         = 300
auto_open_dump            = false
max_conversations         = 100
max_sem_search_results    = 100
sem_search_top_k          = 10
max_extensions            = 15
max_parallel_file_reads   = 64
model_cache_ttl_secs      = 604800
top_p                     = 0.8
top_k                     = 30
max_tokens                = 20480
max_tool_failure_per_turn = 3
max_requests_per_turn     = 100
restricted                = false
tool_supported            = true

# ------------------------------------------------------------------------------
# [retry] — network/provider retry behavior
# ------------------------------------------------------------------------------
[retry]
initial_backoff_ms = 200
min_delay_ms       = 1000
backoff_factor     = 2
max_attempts       = 8
status_codes       = [429, 500, 502, 503, 504, 408, 522, 520, 529]
suppress_errors    = false

# ------------------------------------------------------------------------------
# [http] — HTTP client tuning
# ------------------------------------------------------------------------------
[http]
connect_timeout_secs     = 30
read_timeout_secs        = 900
pool_idle_timeout_secs   = 90
pool_max_idle_per_host   = 5
max_redirects            = 10
hickory                  = false
tls_backend              = "default"
adaptive_window          = true
keep_alive_interval_secs = 60
keep_alive_timeout_secs  = 10
keep_alive_while_idle    = true
accept_invalid_certs     = false

# ------------------------------------------------------------------------------
# [session] — default provider and model
# ------------------------------------------------------------------------------
# Valid provider_id values (partial): claude_code, anthropic, openai,
# openai_compatible, azure, google_ai_studio, vertex_ai, vertex_ai_anthropic,
# bedrock, deepseek, xai, github_copilot, open_router, cerebras, ollama,
# lm_studio, llama_cpp, vllm, jan_ai — see docs/CONFIGURATION.md for the
# full list.
[session]
provider_id = "claude_code"
model_id    = "claude-opus-4-6"

# ------------------------------------------------------------------------------
# [updates] — auto-update behavior
# ------------------------------------------------------------------------------
# frequency: exactly one of "daily" | "weekly" | "always"
# (NEVER use "never" or "monthly" — those are NOT in the enum and will fail
# to deserialize. See crates/forge_domain/src/update.rs:10.)
#
# oh-my-forge ships auto_update = false as a conservative default. Users
# who want automatic updates should flip this to true in their personal
# ~/forge/.forge.toml.
[updates]
frequency   = "daily"
auto_update = false

# ------------------------------------------------------------------------------
# [compact] — automatic context compaction
# ------------------------------------------------------------------------------
[compact]
retention_window = 6
eviction_window  = 0.2
max_tokens       = 2000
token_threshold  = 100000
message_threshold = 200
on_turn_end      = false
# Optional extras:
# turn_threshold = 10
# model = { provider_id = "anthropic", model_id = "claude-haiku-4" }

# ------------------------------------------------------------------------------
# [reasoning] — extended thinking
# ------------------------------------------------------------------------------
# effort: none | minimal | low | medium | high | xhigh | max
[reasoning]
effort  = "high"
enabled = true

# ------------------------------------------------------------------------------
# Optional: inline commands (we DO NOT use this — commands/*.md is the primary
# surface in oh-my-forge for discoverability and per-file version control).
# If you want to add a one-off command without a file, uncomment below:
# ------------------------------------------------------------------------------
# [[commands]]
# name = "hello"
# description = "Say hello"
# prompt = "Say hello to {{parameters}}"
