[package]
name = "omf-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "omf compiled security floor: secrets + memory-guard. Safety-critical only."

[[bin]]
name = "omf-core"
path = "src/main.rs"

[lib]
name = "omf_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zeroize = "1"
base64 = "0.22"
libc = "0.2"
