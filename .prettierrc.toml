# =============================================================================
# .prettierrc.toml — Prettier config (JSON formatting only)
# =============================================================================
# Prettier is used in this repo ONLY for JSON. Markdown is handled by rumdl,
# TOML by taplo, and shell by shfmt. We explicitly do not let prettier touch
# .md files — its opinionated prose wrap would fight rumdl.
# =============================================================================

printWidth    = 100
tabWidth      = 2
useTabs       = false
semi          = true
singleQuote   = false
trailingComma = "none"
endOfLine     = "lf"
